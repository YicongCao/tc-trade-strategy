[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-trade-strategy"
version = "0.1.0"
description = "基于 Trade Copilot 的美股主观交易研究助手"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "yfinance",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
us-market-research = "tc_trade_strategy.research:main"
market-intelligence = "tc_trade_strategy.intelligence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/tc_trade_strategy/reporting.py" = ["E501"]
