[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-trade-strategy"
version = "0.1.0"
description = "Trade Copilot 策略研究与盘前筛选工具"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
premarket-screen = "tc_trade_strategy.premarket:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
